<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Watercolor bleed filter -->
    <filter id="watercolor-bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="0.8" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" opacity="0.3" />
      </feMerge>
    </filter>

    <!-- Pencil sketch stroke filter -->
    <filter id="pencil-stroke" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Paper texture pattern -->
    <pattern id="paper-texture" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#faf6f0" />
      <path d="M0,0 L200,200 M200,0 L0,200" stroke="#e8dfd1" stroke-width="0.5" opacity="0.15" />
    </pattern>

    <!-- Color gradients for watercolor washes -->
    <linearGradient id="wash-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="wash-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wash-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="skin-tone-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a0684b" />
      <stop offset="100%" stop-color="#804e35" />
    </linearGradient>

    <linearGradient id="skin-tone-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b87b5c" />
      <stop offset="100%" stop-color="#995e43" />
    </linearGradient>
  </defs>

  <!-- Canvas Base Paper -->
  <rect width="1200" height="675" fill="url(#paper-texture)" />

  <!-- Background Watercolor Splatters & Washes -->
  <g filter="url(#watercolor-bleed)">
    <!-- Soft background wall wash -->
    <path d="M 50,40 Q 300,10 600,50 T 1150,30 L 1170,640 Q 900,660 550,630 T 30,650 Z" fill="#f4efe6" opacity="0.8" />
    <!-- Blue/Teal ambient wash left -->
    <path d="M 80,80 Q 250,50 450,120 T 400,450 Q 200,500 70,380 Z" fill="url(#wash-blue)" />
    <!-- Warm Ochre wash right -->
    <path d="M 700,60 Q 950,90 1120,150 T 1080,550 Q 800,580 650,420 Z" fill="url(#wash-amber)" />
    <!-- Soft green accent behind plants -->
    <path d="M 1000,200 Q 1150,220 1180,400 T 950,500 Z" fill="url(#wash-teal)" />
  </g>

  <!-- Office Background Elements (Sketched) -->
  <g filter="url(#pencil-stroke)" stroke="#334155" stroke-width="1.8" fill="none" opacity="0.65">
    <!-- Glass Partition / Architecture Board -->
    <line x1="100" y1="80" x2="100" y2="480" stroke-dasharray="6,4" />
    <line x1="100" y1="80" x2="600" y2="80" />
    <line x1="600" y1="80" x2="600" y2="480" stroke-dasharray="6,4" />
    
    <!-- Whiteboard Diagram Sketches on Glass -->
    <rect x="150" y="120" width="90" height="60" rx="8" stroke="#2563eb" stroke-width="1.5" fill="#eff6ff" opacity="0.7" />
    <text x="195" y="155" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">API Core</text>

    <path d="M 240,150 L 310,150" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="310" y="120" width="100" height="60" rx="8" stroke="#0d9488" stroke-width="1.5" fill="#ccfbf1" opacity="0.7" />
    <text x="360" y="155" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">DB Engine</text>

    <!-- Sprint Notes / Sticky Notes -->
    <rect x="460" y="110" width="45" height="45" fill="#fef08a" stroke="#ca8a04" stroke-width="1" opacity="0.85" transform="rotate(-4 460 110)" />
    <rect x="515" y="115" width="45" height="45" fill="#bbf7d0" stroke="#16a34a" stroke-width="1" opacity="0.85" transform="rotate(3 515 115)" />
    <rect x="470" y="165" width="45" height="45" fill="#fed7aa" stroke="#ea580c" stroke-width="1" opacity="0.85" transform="rotate(2 470 165)" />

    <!-- Window Grid lines background right -->
    <line x1="750" y1="80" x2="750" y2="450" />
    <line x1="950" y1="80" x2="950" y2="450" />
    <line x1="680" y1="200" x2="1120" y2="200" />
  </g>

  <!-- Main Workstation Desk -->
  <g filter="url(#pencil-stroke)">
    <!-- Wooden desk top -->
    <path d="M 80,460 L 1120,460 L 1150,630 L 50,630 Z" fill="#d97706" opacity="0.25" stroke="#78350f" stroke-width="2" />
    <!-- Desk front border -->
    <line x1="50" y1="630" x2="1150" y2="630" stroke="#451a03" stroke-width="3" />
  </g>

  <!-- Tech Hardware (Dual Monitors) -->
  <g filter="url(#pencil-stroke)">
    <!-- Left Monitor (Vertical/Primary Code Editor) -->
    <rect x="180" y="240" width="280" height="200" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <rect x="190" y="250" width="260" height="180" fill="#1e293b" />
    <!-- Monitor Stand -->
    <rect x="305" y="440" width="30" height="30" fill="#475569" />
    <ellipse cx="320" cy="470" rx="45" ry="8" fill="#334155" />
    <!-- Code Editor UI Lines (VS Code style watercolor) -->
    <line x1="205" y1="270" x2="270" y2="270" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="280" y1="270" x2="360" y2="270" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <line x1="220" y1="290" x2="310" y2="290" stroke="#4ade80" stroke-width="3" stroke-linecap="round" />
    <line x1="220" y1="310" x2="410" y2="310" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <line x1="235" y1="330" x2="350" y2="330" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
    <line x1="235" y1="350" x2="290" y2="350" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="205" y1="370" x2="330" y2="370" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <line x1="205" y1="390" x2="380" y2="390" stroke="#4ade80" stroke-width="3" stroke-linecap="round" />

    <!-- Right Monitor (Architecture & Analytics Dashboard) -->
    <rect x="480" y="250" width="260" height="190" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <rect x="490" y="260" width="240" height="170" fill="#1e293b" />
    <!-- Monitor Stand -->
    <rect x="595" y="440" width="30" height="25" fill="#475569" />
    <ellipse cx="610" cy="468" rx="40" ry="7" fill="#334155" />
    <!-- Dashboard charts watercolor -->
    <rect x="505" y="275" width="100" height="65" rx="4" fill="#0284c7" opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <path d="M 515,325 L 535,305 L 555,315 L 575,290 L 595,300" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <rect x="615" y="275" width="100" height="65" rx="4" fill="#0d9488" opacity="0.4" stroke="#2dd4bf" stroke-width="1" />
    <circle cx="665" cy="307" r="20" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-dasharray="90 30" />
  </g>

  <!-- Desk Accessories (Watercolor Sketched) -->
  <g filter="url(#pencil-stroke)">
    <!-- Mechanical Keyboard -->
    <rect x="340" y="475" width="180" height="45" rx="4" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <rect x="350" y="482" width="160" height="30" rx="2" fill="#475569" />
    <!-- Mouse -->
    <ellipse cx="550" cy="495" rx="14" ry="20" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <!-- Coffee Mug (South Indian Filter Coffee style) -->
    <ellipse cx="670" cy="495" rx="16" ry="12" fill="#d97706" stroke="#92400e" stroke-width="2" />
    <path d="M 670,495 C 670,515 650,515 650,495" stroke="#92400e" stroke-width="2" fill="none" />
    <!-- Notebook & Pen -->
    <rect x="230" y="480" width="70" height="90" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3" transform="rotate(-8 230 480)" />
    <line x1="240" y1="495" x2="285" y2="495" stroke="#b45309" stroke-width="1" />
    <line x1="240" y1="510" x2="280" y2="510" stroke="#b45309" stroke-width="1" />
    <line x1="240" y1="525" x2="275" y2="525" stroke="#b45309" stroke-width="1" />
  </g>

  <!-- HUMAN FIGURES (EXACTLY 2 INDIAN PROFESSIONALS IN WATERCOLOR SKETCH STYLE) -->

  <!-- FIGURE 1: Indian Female Engineer (Right side, sitting, pointing at code screen) -->
  <g id="female-engineer" filter="url(#watercolor-bleed)">
    <!-- Watercolor Clothing Wash (Teal / Turquoise Hoodie) -->
    <path d="M 670,390 C 660,350 710,340 760,350 C 800,345 830,380 840,430 L 860,570 C 840,610 740,620 670,590 Z" fill="#0d9488" opacity="0.85" />
    <!-- Dark Jeans Wash -->
    <path d="M 680,580 L 850,570 L 870,660 L 670,660 Z" fill="#1e3a8a" opacity="0.8" />
  </g>

  <g id="female-engineer-sketch" filter="url(#pencil-stroke)" stroke="#1e293b" stroke-width="2.2" fill="none">
    <!-- Hair (Long dark hair tied back in ponytail) -->
    <path d="M 740,210 C 710,210 705,240 710,270 C 700,285 690,310 695,330 C 705,340 720,335 725,320 C 730,350 720,380 710,400" fill="#0f172a" stroke="#0f172a" />
    <circle cx="710" cy="275" r="14" fill="#0f172a" />

    <!-- Head & Face Contour (Indian Female Features) -->
    <path d="M 730,225 C 755,220 775,230 780,250 C 785,275 770,300 745,305 C 730,308 720,295 720,275 Z" fill="url(#skin-tone-2)" />
    <!-- Facial Features sketched (Smiling, looking left towards code) -->
    <!-- Eyebrow -->
    <path d="M 732,248 Q 742,243 752,247" stroke="#1e293b" stroke-width="2" fill="none" />
    <!-- Eye -->
    <ellipse cx="744" cy="254" rx="4" ry="3" fill="#0f172a" />
    <!-- Nose profile -->
    <path d="M 736,254 Q 730,265 735,270" stroke="#1e293b" stroke-width="1.8" fill="none" />
    <!-- Smile -->
    <path d="M 735,280 Q 745,290 756,282" stroke="#991b1b" stroke-width="2.2" fill="none" />
    <!-- Bindi / Accent -->
    <circle cx="738" cy="245" r="1.8" fill="#dc2626" />

    <!-- Neck -->
    <path d="M 740,305 L 745,335 M 760,302 L 765,335" fill="url(#skin-tone-2)" />

    <!-- Torso & Hoodie Contour -->
    <path d="M 720,340 Q 675,370 665,420 L 675,580" />
    <path d="M 770,340 Q 820,365 835,420 L 850,570" />
    <!-- Hoodie Strings & Pocket -->
    <path d="M 738,340 L 736,390 M 752,340 L 754,390" stroke="#ccfbf1" stroke-width="2" />
    <path d="M 700,490 Q 750,510 800,490" stroke="#0f766e" stroke-width="2" />

    <!-- Right Arm pointing towards dual screen -->
    <path d="M 670,400 Q 600,400 520,360" stroke="#995e43" stroke-width="18" stroke-linecap="round" />
    <path d="M 670,400 Q 600,400 520,360" stroke="#1e293b" stroke-width="2" />
    <!-- Hand pointing finger -->
    <path d="M 520,360 L 480,345" stroke="#995e43" stroke-width="8" stroke-linecap="round" />
    <path d="M 520,360 L 480,345" stroke="#1e293b" stroke-width="1.8" />

    <!-- Left Arm resting on desk with pen -->
    <path d="M 800,410 Q 770,470 700,490" stroke="#0d9488" stroke-width="16" stroke-linecap="round" />
    <!-- Hand on notebook -->
    <ellipse cx="690" cy="490" rx="10" ry="7" fill="url(#skin-tone-2)" stroke="#1e293b" stroke-width="1.8" />
  </g>

  <!-- FIGURE 2: Indian Male Senior Developer (Left side, leaning in, holding tablet/notes) -->
  <g id="male-engineer" filter="url(#watercolor-bleed)">
    <!-- Watercolor Clothing Wash (Navy Blue Shirt over Grey T-Shirt) -->
    <path d="M 120,380 C 140,320 210,310 270,325 C 310,335 340,370 330,420 L 310,590 C 250,610 160,600 110,560 Z" fill="#1e3a8a" opacity="0.85" />
    <!-- T-Shirt inner wash -->
    <path d="M 200,340 L 240,340 L 235,420 L 195,415 Z" fill="#64748b" opacity="0.9" />
    <!-- Trousers Wash -->
    <path d="M 120,570 L 300,580 L 290,660 L 110,660 Z" fill="#9a3412" opacity="0.75" />
  </g>

  <g id="male-engineer-sketch" filter="url(#pencil-stroke)" stroke="#1e293b" stroke-width="2.2" fill="none">
    <!-- Hair & Beard (Short dark neat hair, groomed beard) -->
    <path d="M 175,180 C 190,165 240,165 255,180 C 265,195 260,220 260,230 C 255,245 250,265 235,270 C 210,275 180,265 175,240 Z" fill="#0f172a" stroke="#0f172a" />
    <!-- Beard outline -->
    <path d="M 180,225 C 175,250 190,275 215,278 C 240,275 255,250 250,225 C 245,260 190,260 180,225 Z" fill="#1e293b" opacity="0.9" />

    <!-- Face Contour (Indian Male Features) -->
    <path d="M 180,195 C 180,185 245,185 248,195 C 255,215 245,250 215,255 C 185,250 175,215 180,195 Z" fill="url(#skin-tone-1)" />

    <!-- Glasses (Modern black rimmed specs) -->
    <rect x="185" y="202" width="26" height="18" rx="3" stroke="#0f172a" stroke-width="2.5" fill="none" />
    <rect x="218" y="202" width="26" height="18" rx="3" stroke="#0f172a" stroke-width="2.5" fill="none" />
    <line x1="211" y1="209" x2="218" y2="209" stroke="#0f172a" stroke-width="2.5" />
    <!-- Eyes behind glasses -->
    <circle cx="198" cy="211" r="2.5" fill="#0f172a" />
    <circle cx="231" cy="211" r="2.5" fill="#0f172a" />

    <!-- Mustache & Smile -->
    <path d="M 200,232 Q 215,238 230,232" stroke="#0f172a" stroke-width="3" />
    <path d="M 205,242 Q 215,248 225,242" stroke="#ffffff" stroke-width="2" />

    <!-- Neck -->
    <path d="M 200,265 L 200,315 M 230,265 L 230,315" fill="url(#skin-tone-1)" />

    <!-- Torso & Open Buttoned Shirt Contour -->
    <path d="M 185,320 Q 140,340 125,390 L 120,570" />
    <path d="M 245,320 Q 285,340 310,390 L 315,570" />
    <!-- Collar -->
    <path d="M 185,320 L 205,360 L 220,325 M 245,320 L 225,360 L 210,325" stroke="#1d4ed8" stroke-width="2" />

    <!-- Left Arm holding Tablet / Digital Stylus -->
    <path d="M 280,360 Q 320,410 300,480" stroke="#1e3a8a" stroke-width="18" stroke-linecap="round" />
    <!-- Digital Tablet -->
    <rect x="270" y="440" width="80" height="60" rx="4" fill="#334155" stroke="#0f172a" stroke-width="2" transform="rotate(-15 270 440)" />
    <rect x="275" y="445" width="70" height="50" rx="2" fill="#38bdf8" opacity="0.6" transform="rotate(-15 270 440)" />
    <!-- Male Hand holding tablet -->
    <ellipse cx="280" cy="485" rx="9" ry="7" fill="url(#skin-tone-1)" stroke="#1e293b" stroke-width="1.8" />
  </g>

  <!-- Foreground Watercolor Splatters & Details -->
  <g filter="url(#watercolor-bleed)" opacity="0.45">
    <circle cx="150" cy="620" r="14" fill="#3b82f6" />
    <circle cx="1050" cy="610" r="18" fill="#d97706" />
    <circle cx="920" cy="100" r="10" fill="#0d9488" />
  </g>

  <!-- Title Badge overlay on bottom left in subtle hand-sketched font -->
  <g opacity="0.85">
    <rect x="60" y="585" width="260" height="42" rx="21" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="82" cy="606" r="8" fill="#10b981" />
    <text x="100" y="611" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Daxin Engineering Culture</text>
  </g>
</svg>