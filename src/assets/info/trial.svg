<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
  <defs>
    <linearGradient id="tr-bg" x1="0" y1="0" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FE"/><stop offset="1" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="tr-box" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E01B22"/><stop offset="1" stop-color="#B3141A"/>
    </linearGradient>
    <filter id="tr-f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B3A66" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="480" height="340" rx="26" fill="url(#tr-bg)"/>
  <circle cx="64" cy="80" r="16" fill="#1B5FCC" opacity="0.22"/>
  <circle cx="420" cy="280" r="40" fill="#F5B301" opacity="0.3"/>
  <g filter="url(#tr-f)">
    <!-- gift box -->
    <rect x="110" y="168" width="180" height="120" rx="14" fill="url(#tr-box)"/>
    <rect x="98" y="134" width="204" height="44" rx="12" fill="#E01B22"/>
    <rect x="186" y="134" width="28" height="154" fill="#F5B301"/>
    <path d="M200 134c-30-44-74-30-60-6 8 12 40 8 60 6z" fill="#F5B301"/>
    <path d="M200 134c30-44 74-30 60-6-8 12-40 8-60 6z" fill="#F5B301"/>
    <!-- FREE tag -->
    <rect x="74" y="74" width="96" height="40" rx="20" fill="#1B5FCC"/>
    <text x="122" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">FREE</text>
    <!-- 15-day timer -->
    <circle cx="352" cy="132" r="62" fill="#fff"/>
    <circle cx="352" cy="132" r="50" stroke="#EAF1FD" stroke-width="10"/>
    <path d="M352 82a50 50 0 1 1-47 67" stroke="#1B5FCC" stroke-width="10" stroke-linecap="round"/>
    <text x="352" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1B3A66">15</text>
    <text x="352" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6B7A90">DAYS</text>
  </g>
</svg>
